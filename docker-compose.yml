services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB:       stockdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  stock-tracker:
    build:
      context: ./Java backend
    container_name: stock-tracker
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/stockdb
      DB_USERNAME:           postgres
      DB_PASSWORD:           postgres
      FETCH_INTERVAL_MS:     60000
    ports:
      - "8080:8080"

  frontend:
    profiles:
      - full
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: quant-frontend
    restart: unless-stopped
    depends_on:
      - stock-tracker
    environment:
      # vite dev proxy target for /jupyter-api (service name on the compose network)
      JUPYTER_PROXY_TARGET: http://jupyter:8888
    ports:
      - "3000:5173"

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter
    ports:
      # Host port 8890 — a host-local jupyter-lab already squats on 8888.
      - "8890:8888"
      # Copilot code executor (build doc M0). Published so the acceptance
      # curl works from the host; the Java container reaches it as jupyter:5000.
      - "5000:5000"
    volumes:
      - ./Test Trading Strategies:/home/jovyan/strategies
      - ./ananke-sdk:/home/jovyan/ananke-sdk
      - ./executor:/home/jovyan/executor
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      ANANKE_API_URL: "http://stock-tracker:8080"
      TIMESCALE_URL: "postgresql+psycopg2://postgres:postgres@timescaledb:5432/stockdb"
    depends_on:
      timescaledb:
        condition: service_healthy
    command: >
      bash -c "pip install -e /home/jovyan/ananke-sdk &&
               mkdir -p /opt/conda/share/jupyter/lab/settings &&
               printf '%s' '{\"@jupyterlab/apputils-extension:themes\":{\"theme\":\"JupyterLab Dark\"}}' > /opt/conda/share/jupyter/lab/settings/overrides.json &&
               (python /home/jovyan/executor/executor.py &) &&
               start-notebook.sh --IdentityProvider.token='' --ServerApp.password='' --ServerApp.allow_origin_regex='^http://localhost:[0-9]+$$' --ServerApp.allow_credentials=True"

volumes:
  timescale_data:
