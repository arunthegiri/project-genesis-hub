# Server
server.port=8080

# TimescaleDB (PostgreSQL-compatible)
spring.datasource.url=jdbc:postgresql://localhost:5432/stockdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Alpaca API
alpaca.api.base-url=https://data.alpaca.markets
alpaca.api.key=${ALPACA_API_KEY}
alpaca.api.secret=${ALPACA_API_SECRET}

# Fetch interval in milliseconds (default: 60000 = 1 minute)
alpaca.fetch.interval-ms=${FETCH_INTERVAL_MS:60000}

# Async executor for backfill jobs
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=10
spring.task.execution.thread-name-prefix=backfill-

# Alpaca Paper Trading API (separate from data API)
alpaca.trading.base-url=https://paper-api.alpaca.markets
alpaca.trading.key=${ALPACA_TRADING_KEY:}
alpaca.trading.secret=${ALPACA_TRADING_SECRET:}

# Logging
logging.level.com.stocktracker=INFO
logging.level.org.springframework.web=WARN
