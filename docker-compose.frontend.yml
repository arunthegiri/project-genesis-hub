# Compose snippet to run the frontend ALONGSIDE your existing Spring Boot stack.
# Drop these services into your existing docker-compose.yml, or run separately.
version: "3.9"

services:
  quant-frontend:
    build:
      context: .
      args:
        # Point this at your Spring backend reachable URL.
        # Same machine via Docker:  http://host.docker.internal:8080
        # Tunnel:                   https://your-tunnel.ngrok.app
        VITE_API_BASE_URL: http://localhost:8080
    container_name: quant-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
